syntax = "proto3";

package SkillBridge.Message;

option csharp_namespace = "SkillBridge.Message";
option py_generic_services = false;
option cc_enable_arenas = true;

////////////////////////////////////////////////////////////////
//
//  Basic Defines
//
////////////////////////////////////////////////////////////////
enum RESULT
{
	SUCCESS = 0;
	FAILED = 1;
}

enum CHARACTER_TYPE
{
	Player = 0;
	NPC = 1;
	Monster = 2;
}

enum CHARACTER_CLASS
{
	NONE = 0;
	WARRIOR = 1;
	WIZARD = 2;
	ARCHER = 3;
}

enum CHARACTER_STATE
{
	IDLE = 0;
	MOVE = 1;
}

enum ENTITY_EVENT
{
	EVT_NONE = 0;    // 改名：加上 EVT_ 前缀
	EVT_IDLE = 1;    // 改名：加上 EVT_ 前缀
	EVT_MOVE_FWD = 2;
	EVT_MOVE_BACK = 3;
	EVT_JUMP = 4;
}

enum DIRECTION
{
	LEFT = 0;
	RIGHT = 1;
}

message NUserInfo {
	int32 id = 1;
	NPlayerInfo player = 2;
}

message NPlayerInfo {
	int32 id = 1;
	repeated NCharacterInfo characters = 2;
}

message NCharacterInfo {
	int32 id = 1;
	int32 tid = 2;
	string name = 3;
	CHARACTER_TYPE type = 4;
	CHARACTER_CLASS class = 5;
	int32 level = 6;
	int32 mapId = 7;
	NEntity entity = 8;
}

message NVector3
{
	int32 x = 1;
	int32 y = 2;
	int32 z = 3;
}

////////////////////////////////////////////////////////////////
//
//  Entities
//
////////////////////////////////////////////////////////////////


message NEntity {
	int32 id = 1;
	NVector3 position = 2;
	NVector3 direction = 3;
	int32 speed = 4;
}

message NEntitySync {
	int32 id = 1;
	ENTITY_EVENT event = 2;
	NEntity entity = 3;
	
}

////////////////////////////////////////////////////////////////
//
//  ActionSequence使用的类型
//
////////////////////////////////////////////////////////////////

// ===== ActionStep（discriminator）=====

message ActionStep {
  string condition = 1;

  oneof action {
    WaitAction wait = 2;
    MoveAction move = 3;
    InteractAction interact = 4;
    SelectAction select = 5;
    InputAction input = 6;
  }
}

// ===== 具体 Action =====

message WaitAction {
  // 当前无额外参数
}

message MoveAction {
  enum Direction {
    LEFT = 0;
    RIGHT = 1;
  }
  Direction direction = 1;
  repeated int32 allowed_contact_obj_ids = 2;
}

message InteractAction {
}

message SelectAction {
  int32 selection = 1;
}

message InputAction {
  string input_text = 1;
}

////////////////////////////////////////////////////////////////
//
//  Messages
//
////////////////////////////////////////////////////////////////

message NetMessage{
	NetMessageRequest Request = 1;
	NetMessageResponse Response = 2;
}

message NetMessageRequest{
	AgentCreateRequest agentCreateRequest = 1;
	AgentLoadRequest agentLoadRequest = 2;
	SceneStartRequest sceneStartRequest = 3;
	SceneStopRequest sceneStopRequest = 4;
	AgentInterruptRequest agentInterruptRequest = 5;
	
	MemoryBackupRequest memoryBackupRequest = 6;
	MemoryRestoreRequest memoryRestoreRequest = 7;
	MemoryDeleteCurrentRequest memoryDeleteCurrentRequest = 8;
	
	UserSendMessageRequest userSendMessageRequest = 9;
	UserSendFeedbackRequest userSendFeedbackRequest = 10;
	UserSendMessageAllRequest userSendMessageAllRequest = 11;
	
	SendToolResultMessageRequest sendToolResultMessageRequest = 12;
	AgentSendMessageRequest agentSendMessageRequest = 13;
	AgentStopActionRequest agentStopActionRequest = 14;
	
	AgentObserveRequest agentObserveRequest = 15;
	AgentMonitorTargetRequest agentMonitorTargetRequest = 16;
	AgentGetMonitorRecordsRequest agentGetMonitorRecordsRequest = 17;
	
	AgentMoveRequest agentMoveRequest = 18;
	AgentFollowTargetRequest agentFollowTargetRequest = 19;
	
	AgentInteractRequest agentInteractRequest = 20;
	AgentSelectRequest agentSelectRequest = 21;
	AgentInputRequest agentInputRequest = 22;
	
	AgentPlanActionSequenceRequest agentPlanActionSequenceRequest = 23;
	AgentStartActionSequenceRequest agentStartActionSequenceRequest = 24;
	AgentContinueActionSequenceRequest agentContinueActionSequenceRequest = 25;
	AgentStopActionSequenceRequest agentStopActionSequenceRequest = 26;

	AgentSetTimerRequest agentSetTimerRequest = 27;
	AgentGetTimerListRequest agentGetTimerListRequest = 28;
	AgentRemoveTimerRequest agentRemoveTimerRequest = 29;
	AgentGetWorldEventLogRequest agentGetWorldEventLogRequest = 30;
	
	AgentExportSkillsRequest agentExportSkillsRequest = 31;
	AgentGetWorldEventSummaryRequest agentGetWorldEventSummaryRequest = 32;
}

message NetMessageResponse{
	AgentCreateResponse agentCreateResponse = 1;
	AgentLoadResponse agentLoadResponse = 2;
	SceneStartResponse sceneStartResponse = 3;
	SceneStopResponse sceneStopResponse = 4;
	AgentInterruptResponse agentInterruptResponse = 5;
	MemoryBackupResponse memoryBackupResponse = 6;
	MemoryRestoreResponse memoryRestoreResponse = 7;
	MemoryDeleteCurrentResponse memoryDeleteCurrentResponse = 8;
	
	AgentExportSkillsResponse agentExportSkillsResponse = 9;
}

////////////////////////////////////////////////////////////////
//
// Agent生命周期
//
////////////////////////////////////////////////////////////////

// 创建Agent
message AgentCreateRequest {
	string name = 1;
	string desc = 2;
}

message AgentCreateResponse {
	bool success = 1;
	string errormsg = 2;
}

// 加载Agent
message AgentLoadRequest {
}

message AgentLoadResponse {
	bool success = 1;
	repeated string agent_names = 2;
	string errormsg = 3;
}

// 开启场景
message SceneStartRequest {
	int32 map_id = 1;
}

message SceneStartResponse {
	bool success = 1;
	string errormsg = 2;
}

// 停止场景
message SceneStopRequest {
}

message SceneStopResponse {
	bool success = 1;
	string errormsg = 2;
}

// 打断所有Agent
message AgentInterruptRequest {
	string reason = 1;
}

message AgentInterruptResponse {
	bool success = 1;
	string errormsg = 2;
}

////////////////////////////////////////////////////////////////
//
//  存档
//
////////////////////////////////////////////////////////////////
message MemoryBackupRequest {
	int32 slot_id = 1;
}

message MemoryBackupResponse {
	bool success = 1;
	string errormsg = 2;
}

message MemoryRestoreRequest {
	int32 slot_id = 1;
}

message MemoryRestoreResponse {
	bool success = 1;
	string errormsg = 2;
}

message MemoryDeleteCurrentRequest {
}

message MemoryDeleteCurrentResponse {
	bool success = 1;
	string errormsg = 2;
}

////////////////////////////////////////////////////////////////
//
//  动作技能导出（v0.21.0 训练场）
//
////////////////////////////////////////////////////////////////
message AgentExportSkillsRequest {
	string name = 1;
}

message AgentExportSkillsResponse {
	bool success = 1;
	string errormsg = 2;
	int32 skill_count = 3;
}

////////////////////////////////////////////////////////////////
//
// 用户向智能体发消息
//
////////////////////////////////////////////////////////////////

message UserSendMessageRequest {
	string agent = 1;
	string user_message = 2;
	bool force_interrupt = 3;
}

message UserSendFeedbackRequest {
	string agent = 1;
	string user_feedback = 2;
	bool force_interrupt = 3;
}

message UserSendMessageAllRequest {
	string user_message = 1;
	bool force_interrupt = 2;
}

////////////////////////////////////////////////////////////////
//
//  智能体工具
//  1. 基础及普通工具
//
////////////////////////////////////////////////////////////////

// 统一工具回调（实现异步 Tool RPC系统）
message SendToolResultMessageRequest {
    string agent = 1;
    string tool_name = 2;
    string request_id = 3;
    string result = 4;
}

// 智能体向用户发消息
message AgentSendMessageRequest {
	string agent = 1;
	string request_id = 2;
	string ai_message = 3;
}

message AgentStopActionRequest {
    string agent = 1;
	string request_id = 2;
    string action_type = 3;
}

////////////////////////////////////////////////////////////////
//
//  2. 观察类工具
//
////////////////////////////////////////////////////////////////
// 观察场景
message AgentObserveRequest {
	string agent = 1;
	string request_id = 2;
}

message AgentMonitorTargetRequest {
	string agent = 1;
	string request_id = 2;
	int32 object_index = 3;
	string object_name = 4;
}

message AgentGetMonitorRecordsRequest {
	string agent = 1;
	string request_id = 2;
	int32 monitor_target_index = 3;
}

////////////////////////////////////////////////////////////////
//
//  3. 移动类工具
//
////////////////////////////////////////////////////////////////

// 向指定方向移动指定距离
message AgentMoveRequest {
	string agent = 1;
	string request_id = 2;
	bool is_right = 3;
	float distance = 4;
}

message AgentFollowTargetRequest {
	string agent = 1;
	string request_id = 2;
    int32 object_index = 3;
    string object_name = 4;
    float min_distance = 5;
    float max_distance = 6;
}

////////////////////////////////////////////////////////////////
//
//  4. 交互类工具
//
////////////////////////////////////////////////////////////////
message AgentInteractRequest {
	string agent = 1;
	string request_id = 2;
}

message AgentSelectRequest {
	string agent = 1;
	string request_id = 2;
	int32 selection = 3;
}

message AgentInputRequest {
	string agent = 1;
	string request_id = 2;
	string input_text = 3;
}

////////////////////////////////////////////////////////////////
//
//  5. 动作序列 
//
////////////////////////////////////////////////////////////////

message AgentPlanActionSequenceRequest {
	string agent = 1;
	string request_id = 2;
	repeated ActionStep action_sequence = 3;
}

message AgentStartActionSequenceRequest {
	string agent = 1;
	string request_id = 2;
}

message AgentContinueActionSequenceRequest {
	string agent = 1;
	string request_id = 2;
}

message AgentStopActionSequenceRequest {
	string agent = 1;
	string request_id = 2;
}

////////////////////////////////////////////////////////////////
//
//  6. 定时器
//
////////////////////////////////////////////////////////////////

message AgentSetTimerRequest {
	string agent = 1;
	string request_id = 2;
	string timer_name = 3;
	float delay_seconds = 4;
	string timer_description = 5;
	bool timer_repeat = 6;
}

message AgentGetTimerListRequest {
	string agent = 1;
	string request_id = 2;
}

message AgentRemoveTimerRequest {
	string agent = 1;
	string request_id = 2;
	int32 timer_id = 3;
}

message AgentGetWorldEventLogRequest {
	string agent = 1;
	string request_id = 2;
}

message AgentGetWorldEventSummaryRequest {
	string agent = 1;
	string request_id = 2;
	int32 max_events = 3;
	bool ignore_self_events = 4;
}

