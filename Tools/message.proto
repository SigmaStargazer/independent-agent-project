syntax = "proto3";

package SkillBridge.Message;

option csharp_namespace = "SkillBridge.Message";
option py_generic_services = false;
option cc_enable_arenas = true;

////////////////////////////////////////////////////////////////
//
//  Basic Defines
//
////////////////////////////////////////////////////////////////
enum RESULT
{
	SUCCESS = 0;
	FAILED = 1;
}

enum CHARACTER_TYPE
{
	Player = 0;
	NPC = 1;
	Monster = 2;
}

enum CHARACTER_CLASS
{
	NONE = 0;
	WARRIOR = 1;
	WIZARD = 2;
	ARCHER = 3;
}

enum CHARACTER_STATE
{
	IDLE = 0;
	MOVE = 1;
}

enum ENTITY_EVENT
{
	EVT_NONE = 0;    // 改名：加上 EVT_ 前缀
	EVT_IDLE = 1;    // 改名：加上 EVT_ 前缀
	EVT_MOVE_FWD = 2;
	EVT_MOVE_BACK = 3;
	EVT_JUMP = 4;
}

enum DIRECTION
{
	LEFT = 0;
	RIGHT = 1;
}

message NUserInfo {
	int32 id = 1;
	NPlayerInfo player = 2;
}

message NPlayerInfo {
	int32 id = 1;
	repeated NCharacterInfo characters = 2;
}

message NCharacterInfo {
	int32 id = 1;
	int32 tid = 2;
	string name = 3;
	CHARACTER_TYPE type = 4;
	CHARACTER_CLASS class = 5;
	int32 level = 6;
	int32 mapId = 7;
	NEntity entity = 8;
}

message NVector3
{
	int32 x = 1;
	int32 y = 2;
	int32 z = 3;
}

////////////////////////////////////////////////////////////////
//
//  Entities
//
////////////////////////////////////////////////////////////////


message NEntity {
	int32 id = 1;
	NVector3 position = 2;
	NVector3 direction = 3;
	int32 speed = 4;
}

message NEntitySync {
	int32 id = 1;
	ENTITY_EVENT event = 2;
	NEntity entity = 3;
	
}

////////////////////////////////////////////////////////////////
//
//  ActionSequence使用的类型
//
////////////////////////////////////////////////////////////////

// ===== ActionStep（discriminator）=====

message ActionStep {
  string condition = 1;

  oneof action {
    WaitAction wait = 2;
    MoveAction move = 3;
  }
}

// ===== 具体 Action =====

message WaitAction {
  // 当前无额外参数
}

message MoveAction {
  enum Direction {
    LEFT = 0;
    RIGHT = 1;
  }
  Direction direction = 1;
}

////////////////////////////////////////////////////////////////
//
//  Messages
//
////////////////////////////////////////////////////////////////

message NetMessage{
	NetMessageRequest Request = 1;
	NetMessageResponse Response = 2;
}

message NetMessageRequest{
	AgentCreateRequest agentCreateRequest = 1;
	AgentLoadRequest agentLoadRequest = 2;
	SceneStartRequest sceneStartRequest = 3;
	UserSendMessageRequest userSendMessageRequest = 4;
	AgentSendMessageRequest agentSendMessageRequest = 5;
	AgentObserveRequest agentObserveRequest = 6;
	AgentMoveRequest agentMoveRequest = 7;
	AgentInteractRequest agentInteractRequest = 8;
	AgentSelectRequest agentSelectRequest = 9;
	AgentInputRequest agentInputRequest = 10;
	AgentActionSequenceRequest agentActionSequenceRequest = 11;
}

message NetMessageResponse{
	AgentCreateResponse agentCreateResponse = 1;
	AgentLoadResponse agentLoadResponse = 2;
	SceneStartResponse sceneStartResponse = 3;
}

// 创建Agent
message AgentCreateRequest {
	string name = 1;
	string desc = 2;
}

message AgentCreateResponse {
	bool success = 1;
	string errormsg = 2;
}

// 加载Agent
message AgentLoadRequest {
}

message AgentLoadResponse {
	bool success = 1;
	repeated string agent_names = 2;
	string errormsg = 3;
}

// 开启场景
message SceneStartRequest {
	int32 map_id = 1;
}

message SceneStartResponse {
	bool success = 1;
	string errormsg = 2;
}

// 用户向智能体发消息
message UserSendMessageRequest {
	string agent = 1;
	string user_message = 2;
}

// 智能体向用户发消息
message AgentSendMessageRequest {
	string agent = 1;
	string ai_message = 2;
}

// 观察场景
message AgentObserveRequest {
}

// 向指定方向移动指定距离
message AgentMoveRequest {
	bool is_right = 1;
	float distance = 2;
}

// 与设备进行交互
message AgentActionSequenceRequest {
  repeated ActionStep action_sequence = 1;
}

message AgentInteractRequest {
}

message AgentSelectRequest {
	int32 selection = 1;
}

message AgentInputRequest {
	string input_text = 1;
}
