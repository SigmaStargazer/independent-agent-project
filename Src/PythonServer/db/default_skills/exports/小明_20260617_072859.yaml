skills:
- name: 走到目标旁交互
  description: 走到某个可交互物体附近并与之交互
  content: '当需要与场景中的某个物体进行交互时，先移动到目标物体附近，再触发交互动作。

    根据目标所处的环境（平地/高处）选择不同的接近方式。

    '
  source: default
  templates:
  - name: 平地接近
    description: 当目标在平地上、可直接走过去时
    action_sequence_template:
    - action: Move
      params:
        target: '{target_name}'
        condition: object[0].distance < 1.5
    - action: Interact
      params:
        target: '{target_name}'
    usage_notes: '- {target_name} 替换为目标物体在场景中的实际名称

      - condition 中的距离阈值可按目标尺寸适当调整（默认 1.5）

      - 如果中途目标移动，Move 会自动追踪

      '
- name: 乘坐自动移动平台跨越陷阱
  description: 通过站在自动移动的平台（浮板）上，利用其往复运动跨越陷阱区域到达对岸
  content: 核心思路：当自动移动平台在近端时站上去，等平台移动到远端停下后，迅速走到对岸安全区域。关键步骤：1.等待平台在近端Idle 2.走到平台上 3.等平台从Idle变为Move
    4.等平台从Move变为Idle 5.走到对岸。注意：不要用Position.x判断远端，用状态变化判断。allowed_contact_obj_ids必须包含平台序号。最后一步距离要适中避免撞墙。
  source: default
  templates:
  - name: 单浮板陷阱场景
    description: 场景中有一个自动移动平台在陷阱上方往复运动，需要利用平台跨越陷阱到达对岸。
    action_sequence_template:
    - action: wait
      condition: objects[6].State == 'Idle'
    - action: move
      condition: displacement >= 5
      direction: right
      allowed_contact_obj_ids:
      - 6
    - action: wait
      condition: objects[6].State == 'Move'
    - action: wait
      condition: objects[6].State == 'Idle'
    - action: move
      condition: displacement >= 4
      direction: right
      allowed_contact_obj_ids:
      - 6
    usage_notes: 替换说明：objects[6]中的6替换为平台实际序号，displacement >= 5替换为走到平台的实际距离，displacement
      >= 4替换为从远端走到对岸的实际距离。重要经验：用状态变化Idle->Move->Idle判断平台到达远端，不要用Position.x。
