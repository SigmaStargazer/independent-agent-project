syntax = "proto3";

package IndependentAgentProject;

option csharp_namespace = "IndependentAgentProject.Protobuf";
option py_generic_services = false;

message Person {
  string name = 1;
  int32 age = 2;
  string message = 3;
}

message LoginRequest {
    string username = 1;
    string password = 2;
}

message LoginResponse {
    bool success = 1;
    string message = 2;
    int32 user_id = 3;
}

message ChatMessage {
    string sender = 1;
    string text = 2;
}